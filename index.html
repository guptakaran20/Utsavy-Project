<!doctype html>
<html lang="en" data-scene="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the edge flowers used down every blush page: fetched up front so no page shows bare edges while it loads -->
    <link rel="preload" as="image" href="/florals.webp" type="image/webp" />
    <link rel="preload" as="image" href="/florals-tile.webp" type="image/webp" />

    <meta name="theme-color" content="#060b1f" />
    <meta name="description" content="You are invited to the wedding of Harleen & Jasraj — Amritsar, February 2027." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Great+Vibes&family=Tiro+Gurmukhi:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- first paint is the night of the plane intro, never the blush of the pages beneath it (index.css loads a moment
         before the intro draws; html[data-scene] there keeps it dark, and this covers the instant before index.css).
         Desktops skip it: they show the phone-frame backdrop instead. -->
    <style>
      @media not all and (min-width: 900px) and (hover: hover) and (pointer: fine) { html, body { background: #1c1c1d; } }
      html.is-embedded, html.is-embedded body { background: #1c1c1d; }
    </style>
    <title>Harleen & Jasraj · ਸ਼ੁਭ ਵਿਆਹ</title>
  </head>
