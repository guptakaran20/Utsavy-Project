<!doctype html>
<html lang="en" data-scene="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060b1f" />
    <meta name="description" content="You are invited to the wedding of Harleen & Jasraj — Amritsar, February 2027." />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cinzel-latin.woff2" crossorigin />
    <link rel="preload" as="image" type="image/webp" href="/intro/plane-top.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the script and Gurmukhi fonts load without blocking first paint (a slow connection shows the intro at once,
         in fallback type, and swaps the fonts in when they arrive). The edge flowers are no longer preloaded here:
         they would compete with the site's own code on a slow connection, and the intro gives them time to arrive. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Tiro+Gurmukhi:ital@0;1&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Tiro+Gurmukhi:ital@0;1&display=swap" rel="stylesheet" /></noscript>
    <!-- first paint is the night of the plane intro, never the blush of the pages beneath it (index.css loads a moment
         before the intro draws; html[data-scene] there keeps it dark, and this covers the instant before index.css).
         Desktops skip it: they show the phone-frame backdrop instead. -->
    <style>
      @media not all and (min-width: 900px) and (hover: hover) and (pointer: fine) { html, body { background: #1c1c1d; } }
      html.is-embedded, html.is-embedded body { background: #1c1c1d; }
    </style>
    <title>Harleen & Jasraj · ਸ਼ੁਭ ਵਿਆਹ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
